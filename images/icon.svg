<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .atom { fill: #ff6b6b; }
      .bond { stroke: #333; stroke-width: 2; }
    </style>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" fill="#ffffff"/>
  
  <!-- Bonds (lines between atoms) -->
  <line x1="32" y1="48" x2="64" y2="64" class="bond"/>
  <line x1="64" y1="64" x2="96" y2="48" class="bond"/>
  <line x1="64" y1="64" x2="80" y2="96" class="bond"/>
  <line x1="64" y1="64" x2="32" y2="96" class="bond"/>
  
  <!-- Atoms (circles) -->
  <circle cx="32" cy="48" r="10" class="atom" opacity="0.8"/>
  <circle cx="64" cy="64" r="12" class="atom"/>
  <circle cx="96" cy="48" r="10" class="atom" opacity="0.8"/>
  <circle cx="80" cy="96" r="10" class="atom" opacity="0.8"/>
  <circle cx="32" cy="96" r="10" class="atom" opacity="0.8"/>
</svg>
